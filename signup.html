<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LostLink — Login</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind Custom Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lostlinkBlue: '#4f46e5',
            lostlinkPurple: '#7c3aed',
            lostlinkGray: '#f3f4f6',
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 4px 20px rgba(0,0,0,0.08)',
          },
        },
      },
    };
  </script>

  <style>
    body {
      background: linear-gradient(to bottom right, #eef2ff, #ffffff);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-soft p-8">

    <!-- Logo -->
    <div class="flex items-center gap-3 justify-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-lostlinkBlue to-lostlinkPurple flex items-center justify-center text-white text-xl font-bold shadow">
        LL
      </div>
      <h1 class="text-2xl font-bold text-gray-800">LostLink</h1>
    </div>

    <!-- Tabs -->
    <div class="flex mb-6 bg-lostlinkGray rounded-lg overflow-hidden">
      <button id="loginTab" class="flex-1 py-2 bg-lostlinkBlue text-white font-semibold transition">Login</button>
      <button id="signupTab" class="flex-1 py-2 text-gray-700 font-semibold transition">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <input type="email" placeholder="Email" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-lostlinkBlue" required>
      <input type="password" placeholder="Password" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-lostlinkBlue" required>
      <button type="submit" class="w-full py-2 bg-lostlinkBlue hover:bg-lostlinkPurple text-white font-semibold rounded-lg shadow-soft transition">Login</button>
      <p class="text-sm text-gray-500 text-center">Forgot password? <a href="#" class="text-lostlinkBlue hover:underline">Reset</a></p>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="space-y-4 hidden">
      <input type="text" placeholder="Full Name" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-lostlinkBlue" required>
      <input type="email" placeholder="Email" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-lostlinkBlue" required>
      <input type="password" placeholder="Password" class="w-full border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-lostlinkBlue" required>
      <button type="submit" class="w-full py-2 bg-lostlinkPurple hover:bg-lostlinkBlue text-white font-semibold rounded-lg shadow-soft transition">Create Account</button>
      <p class="text-sm text-gray-500 text-center">Already have an account? <a href="#" id="backToLogin" class="text-lostlinkBlue hover:underline">Login</a></p>
    </form>

    <!-- Footer -->
    <p class="text-xs text-gray-400 text-center mt-6">LostLink ©️ 2025 — Secure login system prototype.</p>
  </div>

  <script type="module" src="js/auth/auth.js"></script>

</body>
</html>
